[package]
name = "minivectordb"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "MiniVectorDB: a lightweight vector database with SQL, transactions and crash recovery"
license = "Apache-2.0"

# Database algorithms use std only; serde_json is solely the JSON transport codec.
[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }

[[bin]]
name = "minivectordb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"