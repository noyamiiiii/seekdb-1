[package]
name = "minivectordb"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "MiniVectorDB: a lightweight vector database with SQL, transactions and crash recovery"
license = "Apache-2.0"

# Deliberately dependency-free: the whole engine (SQL front end, page store,
# WAL, transactions, vector index) is implemented on top of std only, so the
# evaluation image can be built offline and reproducibly.
[dependencies]

[[bin]]
name = "minivectordb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"